spring.application.name=railway-reservation-springboot

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/railway_db
spring.datasource.username=root
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
# "update" will automatically create or update your database tables based on your Java classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for learning!)
spring.jpa.show-sql=true

server.port=8081

